<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鹈鹕骑自行车</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
      background: #b9e9f5;
    }
    .scene {
      width: min(100vw, 1100px);
      padding: 18px;
    }
    .card {
      position: relative;
      overflow: hidden;
      border: 2px solid rgba(20, 89, 117, .18);
      border-radius: 28px;
      background: #dff8ff;
      box-shadow: 0 24px 60px rgba(18, 79, 105, .22);
    }
    svg { display: block; width: 100%; height: auto; }
    .title {
      position: absolute;
      top: 18px;
      left: 24px;
      z-index: 2;
      color: #15516a;
      letter-spacing: .08em;
      font-weight: 800;
      font-size: clamp(16px, 2vw, 24px);
    }
    .hint {
      position: absolute;
      right: 22px;
      bottom: 16px;
      z-index: 2;
      padding: 7px 12px;
      border-radius: 99px;
      color: #28677b;
      background: rgba(255,255,255,.7);
      font-size: 12px;
      cursor: pointer;
      user-select: none;
    }
    .paused * { animation-play-state: paused !important; }

    .cloud { animation: drift 18s linear infinite; }
    .cloud.slow { animation-duration: 26s; animation-delay: -9s; }
    .wheel-spin { transform-box: fill-box; transform-origin: center; animation: spin 1.35s linear infinite; }
    .pedal-spin { transform-box: fill-box; transform-origin: 50% 50%; animation: spin 1.35s linear infinite; }
    .pelican { animation: ride-bob .68s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    .wing { transform-box: fill-box; transform-origin: 20% 85%; animation: flap 1.2s ease-in-out infinite; }
    .feather { animation: feather-wave 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 0 100%; }
    .feather:nth-child(2) { animation-delay: .12s; }
    .feather:nth-child(3) { animation-delay: .24s; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes ride-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes flap { 0%,100% { transform: rotate(1deg); } 50% { transform: rotate(-13deg); } }
    @keyframes feather-wave { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-7deg); } }
    @keyframes drift { from { transform: translateX(-80px); } to { transform: translateX(1080px); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <main class="scene">
    <section class="card" id="scene" aria-label="一只鹈鹕骑自行车的 SVG 二维动画">
      <div class="title">鹈鹕的海风单车日</div>
      <div class="hint" id="toggle" role="button" tabindex="0">点击暂停 / 继续</div>
      <svg viewBox="0 0 1000 600" role="img" aria-labelledby="svg-title svg-desc">
        <title id="svg-title">鹈鹕骑自行车</title>
        <desc id="svg-desc">一只戴着蓝色帽子的鹈鹕沿着海边骑着红色自行车，云朵缓缓飘过。</desc>
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#8bdcf2"/>
            <stop offset="1" stop-color="#e9fbff"/>
          </linearGradient>
          <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#57c9df"/>
            <stop offset="1" stop-color="#2da5c2"/>
          </linearGradient>
          <linearGradient id="beak" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f9d37c"/>
            <stop offset="1" stop-color="#e9974f"/>
          </linearGradient>
          <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="7"/>
          </filter>
        </defs>

        <rect width="1000" height="600" fill="url(#sky)"/>
        <circle cx="810" cy="108" r="54" fill="#fff7b0" opacity=".85"/>
        <g class="cloud" fill="#fff" opacity=".85">
          <ellipse cx="65" cy="145" rx="70" ry="22"/>
          <ellipse cx="115" cy="135" rx="52" ry="32"/>
          <ellipse cx="163" cy="148" rx="67" ry="21"/>
        </g>
        <g class="cloud slow" fill="#fff" opacity=".65">
          <ellipse cx="560" cy="95" rx="68" ry="20"/>
          <ellipse cx="612" cy="86" rx="42" ry="29"/>
          <ellipse cx="660" cy="98" rx="60" ry="20"/>
        </g>

        <path d="M0 394 Q125 352 252 393 T512 389 T770 390 T1000 374 V600 H0Z" fill="url(#water)"/>
        <path d="M0 421 Q130 399 270 423 T545 419 T820 424 T1000 411" fill="none" stroke="#b8f2f4" stroke-width="6" opacity=".75"/>
        <path d="M0 474 Q150 452 315 477 T630 470 T1000 478" fill="none" stroke="#86dce7" stroke-width="4" opacity=".7"/>
        <path d="M0 520 Q180 493 352 518 T690 513 T1000 522" fill="none" stroke="#8ee3eb" stroke-width="3" opacity=".6"/>

        <ellipse cx="520" cy="495" rx="260" ry="27" fill="#175d79" opacity=".2" filter="url(#soft)"/>
        <path d="M0 455 Q170 436 330 455 T665 454 T1000 448 V600 H0Z" fill="#f4d49b"/>
        <path d="M0 455 Q170 436 330 455 T665 454 T1000 448" fill="none" stroke="#fff0bd" stroke-width="7"/>

        <!-- 自行车 -->
        <g stroke-linecap="round" stroke-linejoin="round">
          <g fill="none" stroke="#174e66" stroke-width="8">
            <circle cx="365" cy="454" r="76" fill="#eafcff" stroke-width="7"/>
            <circle cx="650" cy="454" r="76" fill="#eafcff" stroke-width="7"/>
            <g class="wheel-spin" stroke="#62b5c8" stroke-width="3">
              <path d="M365 378V530 M289 454H441 M311 400L419 508 M311 508L419 400"/>
              <path d="M650 378V530 M574 454H726 M596 400L704 508 M596 508L704 400"/>
            </g>
            <path d="M365 454 L462 369 L550 454 L365 454 M462 369 L650 454 M550 454 L583 374" stroke="#e04d56" stroke-width="10"/>
            <path d="M570 374 L604 374 M583 374 L572 354" stroke="#174e66" stroke-width="8"/>
          </g>
          <g class="pedal-spin" fill="none" stroke="#174e66" stroke-width="6">
            <circle cx="550" cy="454" r="17" fill="#f4c75e"/>
            <path d="M550 454l30 -20 M550 454l-28 18"/>
            <path d="M578 434h21 M522 472h-21" stroke-width="8"/>
          </g>
          <path d="M350 376 Q372 363 398 376" fill="none" stroke="#174e66" stroke-width="9"/>
          <path d="M446 360 Q461 347 481 356" fill="none" stroke="#174e66" stroke-width="8"/>
        </g>

        <!-- 鹈鹕 -->
        <g class="pelican">
          <!-- 身体 -->
          <ellipse cx="477" cy="287" rx="74" ry="103" fill="#f8f5e9" stroke="#174e66" stroke-width="5"/>
          <path d="M428 245 Q470 207 530 246 Q518 320 492 368 Q444 351 426 302Z" fill="#e9e7db"/>
          <path d="M461 278 Q486 295 501 340" fill="none" stroke="#cbcfc3" stroke-width="9" stroke-linecap="round"/>
          <!-- 翼 -->
          <g class="wing">
            <path d="M433 249 Q381 255 370 310 Q399 328 449 307 Q463 286 433 249Z" fill="#d8dcd4" stroke="#174e66" stroke-width="5"/>
            <path d="M424 273 Q401 283 387 304 M435 281 Q414 297 403 316 M444 288 Q431 307 425 322" fill="none" stroke="#a9b6b2" stroke-width="5"/>
          </g>
          <!-- 脖子与头 -->
          <path d="M487 238 Q506 206 497 174" fill="none" stroke="#f8f5e9" stroke-width="36" stroke-linecap="round"/>
          <ellipse cx="496" cy="155" rx="54" ry="52" fill="#f8f5e9" stroke="#174e66" stroke-width="5"/>
          <path d="M456 150 Q472 111 513 110 Q545 115 550 150 Q510 137 456 150Z" fill="#3c8cc4" stroke="#174e66" stroke-width="5"/>
          <path d="M468 124 Q490 94 520 113" fill="none" stroke="#b7e5f5" stroke-width="6"/>
          <!-- 喙 -->
          <path d="M457 159 Q411 160 365 190 Q416 216 466 183 Q480 172 457 159Z" fill="url(#beak)" stroke="#174e66" stroke-width="5"/>
          <path d="M366 190 Q416 188 463 180" fill="none" stroke="#c97842" stroke-width="4"/>
          <circle cx="513" cy="151" r="7" fill="#174e66"/>
          <circle cx="516" cy="148" r="2" fill="#fff"/>
          <!-- 腿与脚 -->
          <path d="M467 354 L457 414 M503 356 L521 414" fill="none" stroke="#e88d4b" stroke-width="11"/>
          <path d="M444 415 Q458 407 477 416 M508 416 Q525 407 542 416" fill="none" stroke="#e88d4b" stroke-width="8"/>
          <!-- 尾羽 -->
          <g class="feather" fill="#d8dcd4" stroke="#174e66" stroke-width="4">
            <path d="M425 341 Q391 357 383 383 Q416 378 439 359Z"/>
            <path d="M431 347 Q403 373 403 394 Q430 383 447 357Z"/>
            <path d="M440 350 Q424 378 431 397 Q451 379 456 355Z"/>
          </g>
        </g>

        <!-- 海鸥装饰 -->
        <path d="M754 245 q15 -14 30 0 q15 -14 30 0" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".75"/>
        <path d="M130 285 q13 -12 26 0 q13 -12 26 0" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".7"/>
      </svg>
    </section>
  </main>
  <script>
    const scene = document.getElementById('scene');
    const toggle = document.getElementById('toggle');
    const toggleAnimation = () => scene.classList.toggle('paused');
    toggle.addEventListener('click', toggleAnimation);
    toggle.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); toggleAnimation(); }
    });
  </script>
</body>
</html>
