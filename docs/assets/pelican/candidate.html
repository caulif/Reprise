<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    display:flex; align-items:center; justify-content:center;
    background:#0b1220;
    font:14px/1.5 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  .stage{
    width:min(94vw,1080px); aspect-ratio:16/9; max-height:92vh;
    border-radius:16px; overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.07);
    background:#bfe4f2;
  }
  svg{ width:100%; height:100%; display:block; }

  /* CSS 与脚本共用的一个真源：踏板转一圈的时间 */
  :root{ --pedal-dur:.9s; }

  /* ---- 背景滚动：图案无限平铺，平移恰好一个 tile 宽度后无缝回环 ---- */
  @keyframes scrollX{ to{ transform: translateX(var(--dx)); } }
  .scrollX{ animation: scrollX linear infinite; }
  #cloudFar { --dx:-400px; animation-duration:26s;  }
  #cloudNear{ --dx:-400px; animation-duration:16s;  }
  #grove    { --dx:-520px; animation-duration:2.65s; }
  #water    { --dx:-200px; animation-duration:1.55s; }
  #bush     { --dx:-340px; animation-duration:1.74s; }
  #road     { --dx:-208px; animation-duration:1.06s; }
  #grass    { --dx:-160px; animation-duration:.82s;  }
  #flower   { --dx:-260px; animation-duration:1.33s; }

  /* ---- 车轮：与踏板共用 --pedal-dur，由脚本统一设置，保证同步 ---- */
  #wheelBack { transform-origin:358px 370px; animation: spin var(--pedal-dur) linear infinite; }
  #wheelFront{ transform-origin:642px 370px; animation: spin var(--pedal-dur) linear infinite; }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  /* ---- 车身整体颠簸（车 + 骑手放在同一父组，才不会错位） ---- */
  #rig{ transform-origin:496px 370px; animation: bob .45s ease-in-out infinite; }
  @keyframes bob{
    0%,100%{ transform: translateY(0)     rotate(0deg); }
    25%    { transform: translateY(-1.8px) rotate(-.2deg); }
    50%    { transform: translateY(0)     rotate(0deg); }
    75%    { transform: translateY(1.5px)  rotate(.15deg); }
  }

  /* ---- 翅膀：收拢在身侧，随蹬踏节奏轻轻起伏（支点靠肩端） ---- */
  #wingNear{ transform-box:fill-box; transform-origin:94% 4%;
             animation: flair .36s ease-in-out infinite alternate; }
  #wingFar { transform-box:fill-box; transform-origin:88% 6%;
             animation: flair .36s ease-in-out infinite alternate; animation-delay:-.18s; }
  @keyframes flair{ from{ transform: rotate(-1.6deg) } to{ transform: rotate(3.4deg) } }

  /* ---- 头与喙囊 ---- */
  #head { transform-box:fill-box; transform-origin:12% 92%;
          animation: nod .45s ease-in-out infinite; }
  @keyframes nod{ 0%,100%{ transform: rotate(2.2deg) } 50%{ transform: rotate(-2.4deg) } }
  #pouch{ transform-box:fill-box; transform-origin:6% 20%;
          animation: jiggle .45s ease-in-out infinite; }
  @keyframes jiggle{ 0%,100%{ transform: scale(1,1) } 50%{ transform: scale(1.06,.94) } }
  #eye{ transform-box:fill-box; transform-origin:center; animation: blink 5.6s infinite; }
  @keyframes blink{ 0%,93%,100%{ transform: scaleY(1) } 96%{ transform: scaleY(.1) } }

  /* ---- 湖上的小船 ---- */
  #boat{ transform-origin:126px 320px; animation: rock 4.4s ease-in-out infinite; }
  @keyframes rock{ 0%,100%{ transform: rotate(-1.4deg) } 50%{ transform: rotate(1.4deg) translateY(-1.2px) } }

  /* ---- 蝴蝶 ---- */
  #butterfly{ animation: flutter 8s ease-in-out infinite; }
  @keyframes flutter{
    0%,100%{ transform: translate(0,0) }
    30%    { transform: translate(74px,-28px) }
    62%    { transform: translate(140px,10px) }
  }
  /* 翅膀绕身体轴开合：左翅支点在右缘、右翅在左缘 */
  #bwL{ transform-box:fill-box; transform-origin:100% 45%;
        animation: flap .22s ease-in-out infinite alternate; }
  #bwR{ transform-box:fill-box; transform-origin:0% 45%;
        animation: flap .22s ease-in-out infinite alternate; }
  @keyframes flap{ from{ transform: scaleX(1) } to{ transform: scaleX(.28) } }

  /* ---- 车轮扬尘 ---- */
  .dust{ opacity:0; animation: dust 1.1s linear infinite; }
  .dust.d2{ animation-delay:.37s } .dust.d3{ animation-delay:.74s }
  @keyframes dust{
    0%  { transform: translate(0,0) scale(.5); opacity:0 }
    25% { opacity:.45 }
    100%{ transform: translate(-66px,-20px) scale(1.7); opacity:0 }
  }

  @media (prefers-reduced-motion: reduce){
    :root{ --pedal-dur:2.6s }   /* 车轮、曲柄、双腿（脚本读同一变量）一起放慢 */
    #cloudFar{ animation-duration:52s } #cloudNear{ animation-duration:32s }
    #grove{ animation-duration:5.3s } #water{ animation-duration:3.1s }
    #bush{ animation-duration:3.5s }  #road{ animation-duration:2.1s }
    #grass{ animation-duration:1.65s } #flower{ animation-duration:2.7s }
    #rig{ animation-duration:1.3s }
    #wingNear,#wingFar{ animation-duration:1.05s }
    #head,#pouch{ animation-duration:1.3s }
  }
</style>
</head>
<body>
<div class="stage">

<svg viewBox="0 0 800 450" role="img" aria-labelledby="ttl desc">
  <title id="ttl">鹈鹕骑自行车</title>
  <desc id="desc">一只鹈鹕骑着橙色自行车沿湖边小路向右前行：车轮转动、双腿踩着踏板、翅膀与头部随节奏摆动，背景的云、树、湖水与路旁花草向后掠过。</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#57b1dc"/>
      <stop offset=".58" stop-color="#a9dcef"/>
      <stop offset="1"   stop-color="#eaf7fa"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#fff7cd" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fff7cd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#8ed6a4"/>
      <stop offset=".2"  stop-color="#79c893"/>
      <stop offset="1"   stop-color="#4f9f6c"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ab4da"/>
      <stop offset="1" stop-color="#2f7fa8"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ded8cb"/>
      <stop offset="1" stop-color="#b5ad9d"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffa563"/>
      <stop offset="1" stop-color="#d75f38"/>
    </linearGradient>
    <radialGradient id="bodyShade" cx=".35" cy=".3" r=".85">
      <stop offset="0"   stop-color="#ffffff"/>
      <stop offset=".7"  stop-color="#f7f8fa"/>
      <stop offset="1"   stop-color="#e6eaef"/>
    </radialGradient>

    <!-- 云：tile 宽 400，用绝对坐标；height=450 免去 y 换算 -->
    <pattern id="cloudFarPat" width="400" height="450" patternUnits="userSpaceOnUse">
      <g fill="#ffffff" opacity=".72">
        <ellipse cx="88"  cy="96"  rx="48" ry="24"/>
        <ellipse cx="132" cy="84"  rx="34" ry="20"/>
        <ellipse cx="58"  cy="86"  rx="26" ry="15"/>
        <ellipse cx="212" cy="60"  rx="40" ry="17"/>
        <ellipse cx="248" cy="52"  rx="26" ry="13"/>
        <ellipse cx="308" cy="140" rx="30" ry="15"/>
        <ellipse cx="340" cy="134" rx="22" ry="12"/>
      </g>
    </pattern>
    <pattern id="cloudNearPat" width="400" height="450" patternUnits="userSpaceOnUse">
      <g fill="#ffffff" opacity=".92">
        <ellipse cx="176" cy="122" rx="56" ry="24"/>
        <ellipse cx="228" cy="112" rx="40" ry="19"/>
        <ellipse cx="140" cy="116" rx="30" ry="15"/>
        <ellipse cx="360" cy="70"  rx="44" ry="18"/>
        <ellipse cx="318" cy="76"  rx="28" ry="13"/>
      </g>
    </pattern>

    <!-- 湖对岸的房子与圆冠树：tile 宽 520 -->
    <pattern id="grovePat" width="520" height="450" patternUnits="userSpaceOnUse">
      <g transform="translate(70,0)">
        <rect x="0" y="272" width="28" height="21" fill="#f4efe6"/>
        <path d="M-5 273 L14 256 L33 273 Z" fill="#c0553f"/>
        <rect x="10" y="283" width="8" height="10" fill="#7d6a52"/>
        <rect x="3"  y="277" width="6" height="6" fill="#8fd0e6"/>
        <rect x="19" y="277" width="6" height="6" fill="#8fd0e6"/>
      </g>
      <g transform="translate(250,4) scale(.88)">
        <rect x="0" y="272" width="24" height="18" fill="#efe7d9"/>
        <path d="M-4 273 L12 258 L28 273 Z" fill="#8c6bb1"/>
        <rect x="9" y="282" width="7" height="9" fill="#7d6a52"/>
      </g>
      <g transform="translate(392,0)">
        <rect x="0" y="296" width="9" height="36" fill="#6b4a2f"/>
        <circle cx="4" cy="284" r="26" fill="#4e9c6b"/>
        <circle cx="-14" cy="296" r="18" fill="#5cae78"/>
        <circle cx="22" cy="294" r="17" fill="#438c5f"/>
      </g>
      <g transform="translate(160,8) scale(.8)">
        <rect x="0" y="296" width="9" height="36" fill="#6b4a2f"/>
        <circle cx="4" cy="284" r="26" fill="#4e9c6b"/>
        <circle cx="-14" cy="296" r="18" fill="#5cae78"/>
        <circle cx="22" cy="294" r="17" fill="#438c5f"/>
      </g>
    </pattern>

    <!-- 湖面波纹：tile 宽 200 -->
    <pattern id="waterPat" width="200" height="450" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#cdf0fd" stroke-linecap="round">
        <path d="M4 308 q11 -3.5 22 0 t22 0 t22 0 t22 0 t22 0 t22 0 t22 0 t22 0" stroke-width="1.6" opacity=".6"/>
        <path d="M40 316 q11 -3 22 0 t22 0 t22 0 t22 0 t22 0" stroke-width="1.3" opacity=".4"/>
        <path d="M-16 324 q11 -3 22 0 t22 0 t22 0 t22 0 t22 0 t22 0" stroke-width="1.2" opacity=".3"/>
      </g>
    </pattern>

    <!-- 路边灌木：tile 宽 340 -->
    <pattern id="bushPat" width="340" height="450" patternUnits="userSpaceOnUse">
      <g>
        <ellipse cx="40" cy="360" rx="30" ry="15" fill="#3f8f5d"/>
        <ellipse cx="60" cy="356" rx="22" ry="12" fill="#4da36d"/>
        <ellipse cx="22" cy="358" rx="17" ry="10" fill="#357f52"/>
      </g>
      <g transform="translate(180,4) scale(.85)">
        <ellipse cx="40" cy="360" rx="30" ry="15" fill="#3f8f5d"/>
        <ellipse cx="60" cy="356" rx="22" ry="12" fill="#4da36d"/>
        <ellipse cx="22" cy="358" rx="17" ry="10" fill="#357f52"/>
      </g>
    </pattern>

    <!-- 路面虚线：tile 宽 208 = 4 × (34 + 18) -->
    <pattern id="roadPat" width="208" height="450" patternUnits="userSpaceOnUse">
      <path d="M0 388 H208" fill="none" stroke="#fdfbf4" stroke-width="4"
            stroke-dasharray="34 18" opacity=".75"/>
    </pattern>

    <!-- 草丛：tile 宽 160，草根落在 y=424 -->
    <pattern id="grassPat" width="160" height="450" patternUnits="userSpaceOnUse">
      <g fill="#2e7a4c">
        <path d="M18 424 q-4 -17 -13 -22 q11 5 13 22 Z"/>
        <path d="M18 424 q1 -19 10 -26 q-6 15 -10 26 Z"/>
        <path d="M18 424 q-7 -12 -17 -14 q12 2 17 14 Z"/>
      </g>
      <g transform="translate(62,6) scale(.82)" fill="#357f52">
        <path d="M18 424 q-4 -17 -13 -22 q11 5 13 22 Z"/>
        <path d="M18 424 q1 -19 10 -26 q-6 15 -10 26 Z"/>
        <path d="M18 424 q-7 -12 -17 -14 q12 2 17 14 Z"/>
      </g>
      <g transform="translate(112,-5)" fill="#2e7a4c">
        <path d="M18 424 q-4 -17 -13 -22 q11 5 13 22 Z"/>
        <path d="M18 424 q1 -19 10 -26 q-6 15 -10 26 Z"/>
        <path d="M18 424 q-7 -12 -17 -14 q12 2 17 14 Z"/>
      </g>
    </pattern>

    <!-- 小花：tile 宽 260 -->
    <pattern id="flowerPat" width="260" height="450" patternUnits="userSpaceOnUse">
      <g transform="translate(46,0)">
        <path d="M0 424 L0 409" stroke="#3f8a5c" stroke-width="1.6"/>
        <g fill="#ffd9e8">
          <circle cx="0" cy="405" r="3.4"/><circle cx="4.4" cy="409" r="3.4"/>
          <circle cx="-4.4" cy="409" r="3.4"/><circle cx="0" cy="410.6" r="3.4"/>
        </g>
        <circle cx="0" cy="408" r="1.8" fill="#ffb703"/>
      </g>
      <g transform="translate(174,7) scale(.85)">
        <path d="M0 424 L0 409" stroke="#3f8a5c" stroke-width="1.6"/>
        <g fill="#fff2bc">
          <circle cx="0" cy="405" r="3.4"/><circle cx="4.4" cy="409" r="3.4"/>
          <circle cx="-4.4" cy="409" r="3.4"/><circle cx="0" cy="410.6" r="3.4"/>
        </g>
        <circle cx="0" cy="408" r="1.8" fill="#e8871e"/>
      </g>
      <g transform="translate(232,-4) scale(.75)">
        <path d="M0 424 L0 409" stroke="#3f8a5c" stroke-width="1.6"/>
        <g fill="#dbe9ff">
          <circle cx="0" cy="405" r="3.4"/><circle cx="4.4" cy="409" r="3.4"/>
          <circle cx="-4.4" cy="409" r="3.4"/><circle cx="0" cy="410.6" r="3.4"/>
        </g>
        <circle cx="0" cy="408" r="1.8" fill="#ffb703"/>
      </g>
    </pattern>

    <clipPath id="lakeClip"><rect x="0" y="300" width="800" height="30"/></clipPath>
    <clipPath id="roadClip"><rect x="0" y="366" width="800" height="44"/></clipPath>
  </defs>

  <!-- ================= 天空 ================= -->
  <rect x="0" y="0" width="800" height="450" fill="url(#sky)"/>
  <circle cx="672" cy="78" r="92" fill="url(#sunGlow)"/>
  <circle cx="672" cy="78" r="31" fill="#fff8d2" opacity=".95"/>
  <rect id="cloudFar"  class="scrollX" x="-400" y="0" width="1600" height="210" fill="url(#cloudFarPat)"/>
  <rect id="cloudNear" class="scrollX" x="-400" y="0" width="1600" height="210" fill="url(#cloudNearPat)"/>

  <!-- ================= 湖对岸的远山 ================= -->
  <path d="M0 300 C 74 230, 156 232, 218 292 C 264 262, 340 252, 398 300 L398 340 L0 340 Z" fill="#a6d2a7"/>
  <path d="M366 302 C 430 242, 520 236, 588 296 C 642 258, 730 252, 800 300 L800 344 L366 344 Z" fill="#8fc294"/>
  <rect id="grove" class="scrollX" x="-520" y="230" width="1600" height="150" fill="url(#grovePat)"/>

  <!-- ================= 湖 ================= -->
  <rect x="0" y="300" width="800" height="30" fill="url(#water)"/>
  <rect x="0" y="300" width="800" height="3" fill="#b6e9f9" opacity=".65"/>
  <g clip-path="url(#lakeClip)">
    <rect id="water" class="scrollX" x="-400" y="300" width="1600" height="30" fill="url(#waterPat)"/>
    <g id="boat">
      <path d="M104 318 L150 318 L141 327 L112 327 Z" fill="#8a5a44"/>
      <path d="M127 318 L127 303" stroke="#6f4633" stroke-width="2.4"/>
      <path d="M129 305 L147 316 L129 316 Z" fill="#fdf6e6"/>
      <path d="M125 307 L107 316 L125 316 Z" fill="#efe2ca"/>
    </g>
  </g>

  <!-- ================= 地面 ================= -->
  <rect x="0" y="330" width="800" height="120" fill="url(#ground)"/>
  <rect x="0" y="330" width="800" height="12" fill="#86cc99"/>

  <!-- 小路 -->
  <rect x="0" y="366" width="800" height="44" fill="url(#road)"/>
  <rect x="0" y="366" width="800" height="2" fill="#efe9dc" opacity=".85"/>
  <rect x="0" y="408" width="800" height="2" fill="#948b7c" opacity=".55"/>
  <g clip-path="url(#roadClip)">
    <rect id="road" class="scrollX" x="-400" y="366" width="1600" height="44" fill="url(#roadPat)"/>
  </g>

  <!-- 路边灌木（比小路更靠近观察者） -->
  <rect id="bush" class="scrollX" x="-400" y="340" width="1600" height="34" fill="url(#bushPat)"/>

  <!-- 蝴蝶：外层负责漂移（CSS transform），内层负责落点（属性 transform） -->
  <g id="butterfly">
   <g transform="translate(470,208)">
    <g id="bwL">
      <ellipse cx="-8" cy="-2" rx="10" ry="13" fill="#ffd166" transform="rotate(-20)"/>
      <ellipse cx="-5" cy="10" rx="7"  ry="9"  fill="#f7a53b" transform="rotate(-10)"/>
    </g>
    <g id="bwR">
      <ellipse cx="8" cy="-2" rx="10" ry="13" fill="#ffd166" transform="rotate(20)"/>
      <ellipse cx="5" cy="10" rx="7"  ry="9"  fill="#f7a53b" transform="rotate(10)"/>
    </g>
    <rect x="-1.7" y="-8" width="3.4" height="20" rx="1.7" fill="#5a4632"/>
    <circle cx="0" cy="-10" r="3.2" fill="#5a4632"/>
    <path d="M0 -12 q-6 -7 -10 -8 M0 -12 q6 -7 10 -8" fill="none" stroke="#5a4632" stroke-width="1.2"/>
   </g>
  </g>

  <!-- 车轮扬尘 -->
  <g fill="#d3cbba">
    <circle class="dust"    cx="354" cy="404" r="6"/>
    <circle class="dust d2" cx="354" cy="404" r="6"/>
    <circle class="dust d3" cx="354" cy="404" r="6"/>
  </g>

  <!-- 地面投影 -->
  <ellipse cx="500" cy="412" rx="158" ry="9" fill="#1f4a34" opacity=".15"/>

  <!-- ================= 车 + 骑手（同一父组，共用颠簸） ================= -->
  <g id="rig">

    <!-- 远侧腿（车架后侧）；d 与脚的落点每帧由脚本按踏板角度重算 -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <path id="legFar" d="M458 292L487 318L474 356" fill="none" stroke="#c99a35" stroke-width="8"/>
      <path id="footFar" d="M-4 4.5h18" fill="none" stroke="#b8902f" stroke-width="6" transform="translate(474 356)"/>
    </g>

    <!-- ========== 自行车 ========== -->
    <g id="bike">
      <!-- 后轮 -->
      <g id="wheelBack">
        <circle cx="358" cy="370" r="40" fill="none" stroke="#332f2b" stroke-width="9"/>
        <circle cx="358" cy="370" r="33.5" fill="none" stroke="#f8f3e8" stroke-width="3"/>
        <g stroke="#f8f3e8" stroke-width="1.8" opacity=".95">
          <path d="M358 336.5 L358 403.5 M324.5 370 L391.5 370"/>
          <path d="M334.3 346.3 L381.7 393.7 M381.7 346.3 L334.3 393.7"/>
        </g>
        <path d="M358 370 a26 26 0 0 1 18.4 7.6" fill="none" stroke="#ff5a3c" stroke-width="2.6" opacity=".8"/>
        <circle cx="358" cy="370" r="4.6" fill="#8d8479"/>
      </g>

      <!-- 前轮 -->
      <g id="wheelFront">
        <circle cx="642" cy="370" r="40" fill="none" stroke="#332f2b" stroke-width="9"/>
        <circle cx="642" cy="370" r="33.5" fill="none" stroke="#f8f3e8" stroke-width="3"/>
        <g stroke="#f8f3e8" stroke-width="1.8" opacity=".95">
          <path d="M642 336.5 L642 403.5 M608.5 370 L675.5 370"/>
          <path d="M618.3 346.3 L665.7 393.7 M665.7 346.3 L618.3 393.7"/>
        </g>
        <path d="M642 370 a26 26 0 0 1 18.4 7.6" fill="none" stroke="#ff5a3c" stroke-width="2.6" opacity=".8"/>
        <circle cx="642" cy="370" r="4.6" fill="#8d8479"/>
      </g>

      <!-- 链条：与飞轮(r10)、牙盘(r20)上下相切 -->
      <path d="M348.9 363.9 L476.7 342.1" stroke="#5b564e" stroke-width="2.6"/>
      <path d="M348.9 376.1 L476.7 357.9" stroke="#5b564e" stroke-width="2.6"/>
      <circle cx="358" cy="370" r="10" fill="none" stroke="#9a9186" stroke-width="2"/>
      <circle cx="358" cy="370" r="5" fill="#6d675e"/>

      <!-- 车架 -->
      <g stroke="url(#frame)" stroke-width="9" stroke-linecap="round" fill="none">
        <path d="M358 370 L496 356"/>   <!-- 后下叉 -->
        <path d="M358 370 L455 288"/>   <!-- 后上叉 -->
        <path d="M496 356 L455 288"/>   <!-- 座管 -->
        <path d="M496 356 L582 324"/>   <!-- 下管 -->
        <path d="M455 288 L602 272"/>   <!-- 上管 -->
        <path d="M602 272 L582 324"/>   <!-- 头管 -->
        <path d="M582 324 L642 370"/>   <!-- 前叉 -->
      </g>

      <!-- 车座 -->
      <path d="M428 290 q24 -8 37 2 q-17 11 -37 6 Z" fill="#3a3330"/>
      <!-- 车把 -->
      <path d="M602 272 L610 250 q5 -8 -15 -6" fill="none" stroke="#3a3330" stroke-width="6" stroke-linecap="round"/>
      <path d="M602 272 L618 252" fill="none" stroke="#3a3330" stroke-width="7" stroke-linecap="round"/>
      <circle cx="589" cy="258" r="5" fill="#cdc7ba" stroke="#8f887c" stroke-width="1.5"/>

      <!-- 曲柄 + 踏板（由脚本按蹬踏角度旋转） -->
      <g id="crank">
        <circle cx="496" cy="356" r="20" fill="none" stroke="#b9b2a6" stroke-width="2"/>
        <circle cx="496" cy="356" r="20" fill="none" stroke="#b9b2a6" stroke-width="1"
                stroke-dasharray="3 5" opacity=".7"/>
        <path d="M496 356 L518 356" stroke="#6d675e" stroke-width="6" stroke-linecap="round"/>
        <path d="M496 356 L474 356" stroke="#8b847a" stroke-width="6" stroke-linecap="round"/>
        <circle cx="518" cy="356" r="5" fill="#3a3330"/>
        <circle cx="474" cy="356" r="5" fill="#3a3330"/>
        <circle cx="496" cy="356" r="5" fill="#cdc7ba"/>
      </g>
    </g>

    <!-- ========== 鹈鹕 ========== -->
    <g id="pelican">
      <!-- 远侧翅膀（收拢在身侧，被身体挡住大半） -->
      <g id="wingFar" opacity=".55">
        <path d="M510 272 C 488 276, 466 290, 456 314 C 476 318, 500 308, 514 292 Z" fill="#c7ccd4"/>
      </g>

      <!-- 尾羽：向后下方伸出，扁平 -->
      <path d="M462 280 Q430 274 416 286 Q438 296 462 304 Z" fill="#e9ebef"/>

      <!-- 身体（重心落在躯干中部，略向前倾） -->
      <g transform="rotate(-18 494 284)">
        <ellipse cx="494" cy="284" rx="48" ry="33" fill="url(#bodyShade)"/>
      </g>
      <path d="M468 306 Q494 318 520 303 Q502 318 472 316 Z" fill="#dfe3e9" opacity=".8"/>

      <!-- 颈：由身体前上方斜向伸出 -->
      <path d="M514 262 Q526 226 554 214 L576 232 Q542 248 536 276 Z" fill="#fbfbf8"/>
      <path d="M521 260 Q532 226 558 217" fill="none" stroke="#e2e4e8" stroke-width="1.6" opacity=".9"/>

      <!-- 头与喙 -->
      <g id="head">
        <path d="M562 190 q3 -13 16 -15 q-8 7 -8 15 Z" fill="#f1f2f4"/>
        <circle cx="576" cy="212" r="22" fill="#ffffff"/>

        <!-- 喙囊 -->
        <path id="pouch" d="M594 206 L666 211 Q636 256 596 231 Z" fill="#ffd180"/>
        <path d="M598 212 Q632 238 660 212" fill="none" stroke="#e9b45c" stroke-width="1.6" opacity=".85"/>

        <!-- 上喙 -->
        <path d="M590 200 Q632 198 668 209 Q632 217 591 212 Z" fill="#ffb74d"/>
        <path d="M592 204 Q632 204 664 210" fill="none" stroke="#7a6a52" stroke-width="1" opacity=".65"/>
        <ellipse cx="664" cy="210" rx="3.6" ry="2.6" fill="#5d5044"/>
        <path d="M656 204 q4 -1.5 7 0" fill="none" stroke="#3f372e" stroke-width="1.4" opacity=".6"/>

        <!-- 眼睛 -->
        <circle cx="584" cy="204" r="6.6" fill="#ffffff" stroke="#c9ccd2" stroke-width="1"/>
        <g id="eye">
          <circle cx="585" cy="204" r="3.5" fill="#2a2622"/>
          <circle cx="586.4" cy="202.5" r="1.1" fill="#fff"/>
        </g>
      </g>

      <!-- 近侧翅膀：贴着身体收拢，略小于身体轮廓 -->
      <g id="wingNear">
        <path d="M514 266 C 488 270, 462 286, 452 312 C 472 319, 498 310, 512 294 C 522 284, 523 272, 514 266 Z"
              fill="#fbfbf9" stroke="#dfe2e7" stroke-width="1.5"/>
        <path d="M508 278 C 488 282, 470 294, 460 310" fill="none" stroke="#e2e5ea" stroke-width="1.4"/>
        <path d="M512 290 C 496 294, 480 304, 472 314" fill="none" stroke="#e7eaee" stroke-width="1.2"/>
      </g>
    </g>

    <!-- 近侧腿（车架这一侧，最上层） -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <path id="legNear" d="M462 296L489 322L518 356" fill="none" stroke="#f7c948" stroke-width="9"/>
      <path id="footNear" d="M-4 4.5h18" fill="none" stroke="#e0ab48" stroke-width="6" transform="translate(518 356)"/>
    </g>
  </g>

  <!-- ================= 前景花草：遮住车轮下缘，制造纵深 ================= -->
  <rect id="grass"  class="scrollX" x="-400" y="398" width="1600" height="52" fill="url(#grassPat)"/>
  <rect id="flower" class="scrollX" x="-400" y="394" width="1600" height="56" fill="url(#flowerPat)"/>
</svg>
</div>

<script>
/* 双腿踩踏：把脚固定在曲柄踏板圆周上，用两连杆 IK 反解膝盖位置。
   车身其余部分由 CSS 驱动，脚本只管曲柄与双腿，保证脚与踏板绝对同步。 */
(function () {
  var svg = document.querySelector('svg');
  if (!svg) return;

  var el = {
    crank:    svg.querySelector('#crank'),
    legNear:  svg.querySelector('#legNear'),
    legFar:   svg.querySelector('#legFar'),
    footNear: svg.querySelector('#footNear'),
    footFar:  svg.querySelector('#footFar')
  };
  for (var k in el) { if (!el[k]) return; }

  var CRANK_C = { x: 496, y: 356 };   // 中轴
  var CRANK_R = 22;                   // 曲柄长度
  var HIP_N = { x: 462, y: 296 };     // 近侧髋关节（坐在车座上）
  var HIP_F = { x: 458, y: 292 };     // 远侧髋关节
  var L_THIGH = 48, L_SHIN = 52;      // 大腿 / 小腿（须长到在踏板最远点仍可达）
  var FOOT_DY = 4.5;                  // 脚掌相对踝关节的下沉量

  var warned = false;

  function solve(hip, th) {
    var px = CRANK_C.x + CRANK_R * Math.cos(th);
    var py = CRANK_C.y + CRANK_R * Math.sin(th);
    var dx = px - hip.x, dy = py - hip.y;
    var d = Math.hypot(dx, dy);

    // 够不着时把脚拉回可达范围；正常几何下不该发生，发生就说明腿太短
    var reach = L_THIGH + L_SHIN - 0.6;
    if (d > reach) {
      if (!warned) { warned = true; console.warn('腿长不足，踏板角度 ' + th + ' 处需夹紧'); }
      var s = reach / d; dx *= s; dy *= s; d = reach;
    }

    var a = (L_THIGH * L_THIGH - L_SHIN * L_SHIN + d * d) / (2 * d);
    var h = Math.sqrt(Math.max(0, L_THIGH * L_THIGH - a * a));
    var ux = dx / d, uy = dy / d;

    // 两个解中取膝盖朝前的那个
    var x1 = hip.x + a * ux + h * uy, y1 = hip.y + a * uy - h * ux;
    var x2 = hip.x + a * ux - h * uy, y2 = hip.y + a * uy + h * ux;
    var kx = x1 >= x2 ? x1 : x2, ky = x1 >= x2 ? y1 : y2;

    return {
      d: 'M' + hip.x + ' ' + hip.y +
         'L' + kx.toFixed(1) + ' ' + ky.toFixed(1) +
         'L' + (hip.x + dx).toFixed(1) + ' ' + (hip.y + dy).toFixed(1),
      x: hip.x + dx, y: hip.y + dy
    };
  }

  var mq = window.matchMedia('(prefers-reduced-motion: reduce)');
  var t0 = null;

  // 与 CSS 共用 --pedal-dur：改这个变量，车轮与双腿一起变速
  function periodMs() {
    var v = parseFloat(getComputedStyle(document.documentElement)
              .getPropertyValue('--pedal-dur'));
    return (isNaN(v) || v <= 0 ? 0.9 : v) * 1000;
  }
  var period = periodMs();
  mq.addEventListener('change', function () { period = periodMs(); });

  function frame(t) {
    if (t0 === null) t0 = t;
    var th = 2 * Math.PI * (((t - t0) % period) / period);

    el.crank.setAttribute('transform',
      'rotate(' + (th * 180 / Math.PI).toFixed(2) + ' ' + CRANK_C.x + ' ' + CRANK_C.y + ')');

    var n = solve(HIP_N, th);
    var f = solve(HIP_F, th + Math.PI);
    el.legNear.setAttribute('d', n.d);
    el.legFar.setAttribute('d', f.d);
    el.footNear.setAttribute('transform',
      'translate(' + n.x.toFixed(1) + ' ' + (n.y + FOOT_DY).toFixed(1) + ')');
    el.footFar.setAttribute('transform',
      'translate(' + f.x.toFixed(1) + ' ' + (f.y + FOOT_DY).toFixed(1) + ')');

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
