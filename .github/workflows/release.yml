name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Retry an existing release, for example v0.1.1 (empty: refresh release PR)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/') && 'reprise-publish' || 'reprise-release-pr' }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.repository == 'caulif/Reprise' && github.ref == 'refs/heads/main' && inputs.tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.11.1
      - run: npm ci --ignore-scripts
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Run CI on robot-created release PRs
        if: steps.release.outputs.prs_created == 'true'
        run: node scripts/release-artifacts.mjs dispatch-checks
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
      - name: Publish from the immutable tag workflow
        if: steps.release.outputs.release_created == 'true'
        run: node scripts/release-artifacts.mjs dispatch-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}

  retry:
    if: github.repository == 'caulif/Reprise' && github.ref == 'refs/heads/main' && inputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.11.1
      - run: npm ci --ignore-scripts
      - name: Retry using the original tag, not the current main
        run: node scripts/release-artifacts.mjs dispatch-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}

  identity:
    if: >-
      github.repository == 'caulif/Reprise' && startsWith(github.ref, 'refs/tags/v') && inputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      sha: ${{ steps.identity.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.11.1
      - name: Resolve immutable release commit
        id: identity
        run: |
          npm ci --ignore-scripts
          node scripts/release-artifacts.mjs identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}

  package:
    needs: identity
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.identity.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.11.1
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - run: npm run check:full
      - name: Build the one distribution artifact
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:RUNNER_TEMP 'reprise-release'
          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null
          npm pack --json --pack-destination $artifactDir > (Join-Path $artifactDir 'pack.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/release-artifacts.mjs package $artifactDir
        env:
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
          RELEASE_SHA: ${{ needs.identity.outputs.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reprise-release
          path: ${{ runner.temp }}/reprise-release/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [identity, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.identity.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.11.1
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.6.2
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: reprise-release
          path: ${{ runner.temp }}/reprise-release
      - name: Check package and existing registry version
        id: registry
        run: node scripts/release-artifacts.mjs registry "$RUNNER_TEMP/reprise-release"
        env:
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
          RELEASE_SHA: ${{ needs.identity.outputs.sha }}
      - name: Publish with npm Trusted Publishing
        if: steps.registry.outputs.exists != 'true'
        run: npm publish "$RUNNER_TEMP/reprise-release/$PACKAGE_FILE" --access public --tag latest --provenance
        env:
          PACKAGE_FILE: ${{ steps.registry.outputs.filename }}
      - name: Verify registry and installed CLI
        run: node scripts/release-artifacts.mjs verify-registry "$RUNNER_TEMP/reprise-release"
        env:
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
          RELEASE_SHA: ${{ needs.identity.outputs.sha }}
      - name: Attach identical artifact and publish GitHub Release
        run: node scripts/release-artifacts.mjs finish "$RUNNER_TEMP/reprise-release"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
          RELEASE_SHA: ${{ needs.identity.outputs.sha }}
