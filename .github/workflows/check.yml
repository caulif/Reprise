name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: node scripts/run-gates.mjs static

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - if: runner.os == 'Linux'
        run: node scripts/run-gates.mjs test --concurrency 2
      - if: runner.os != 'Linux'
        run: node scripts/run-gates.mjs test
      - name: Diagnose the actual preview browser independently of parallel tests
        if: always() && runner.os == 'Linux'
        continue-on-error: true
        run: |
          node scripts/browser-preview-smoke.mjs --self-test
          node scripts/browser-preview-smoke.mjs

  audit:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: node scripts/run-gates.mjs audit
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tui-audit
          path: docs/tui-audit/
          # includes frames-generated/ when Windows compareFrames fails
          retention-days: 7

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run test:coverage -- --concurrency 2

  all-checks-passed:
    if: always()
    needs: [static, test, audit, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Require every lane
        run: |
          test "${{ needs.static.result }}" = "success"
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.audit.result }}" = "success"
          test "${{ needs.coverage.result }}" = "success"
